    <script>
      // AudioContext Auto-Resume Patch
      window.__audioContexts = [];
      const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
      if (OriginalAudioContext) {
        window.AudioContext = function(...args) {
          const ctx = new OriginalAudioContext(...args);
          window.__audioContexts.push(ctx);
          return ctx;
        };
        window.AudioContext.prototype = OriginalAudioContext.prototype;
        if (window.webkitAudioContext) window.webkitAudioContext = window.AudioContext;
        
        const resumeAudio = () => {
          window.__audioContexts.forEach(ctx => {
            if (ctx.state === 'suspended') ctx.resume();
          });
        };
        ['click', 'touchstart', 'scroll', 'wheel', 'keydown'].forEach(evt => {
          window.addEventListener(evt, resumeAudio, { passive: true });
        });
      }

      // R3F Canvas Wake-up & Resize Helper
      (function() {
        const triggerWakeup = () => {
          window.dispatchEvent(new Event('resize'));
          const canvas = document.querySelector('canvas');
          if (canvas) {
            const rect = canvas.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              const x = rect.left + rect.width / 2;
              const y = rect.top + rect.height / 2;
              const opts = { clientX: x, clientY: y, bubbles: true };
              canvas.dispatchEvent(new PointerEvent('pointermove', opts));
              canvas.dispatchEvent(new MouseEvent('mousemove', opts));
            }
          }
        };

        // Schedule wakeup at key timestamps (during loader, right after loader fades, and later)
        [100, 500, 1000, 2000, 3000, 4800, 5100, 5500, 6000, 7000, 8000, 10000].forEach(delay => {
          setTimeout(triggerWakeup, delay);
        });

        // Also trigger on first user interaction events to immediately initialize
        const events = ['click', 'touchstart', 'mousemove', 'scroll', 'pointermove'];
        const handler = () => {
          triggerWakeup();
          events.forEach(evt => window.removeEventListener(evt, handler));
        };
        events.forEach(evt => window.addEventListener(evt, handler, { passive: true }));
      })();

      // Audio Autoplay Recovery Helper (resumes blocked HTML5 audio on first user gesture)
      (function() {
        const events = ['click', 'touchstart', 'scroll', 'wheel', 'keydown', 'pointerdown'];
        window.userInteracted = false;
        
        const handleInteraction = () => {
          window.userInteracted = true;
          playBackgroundMusic();
        };

        const playBackgroundMusic = () => {
          const bgAudio = document.querySelector('audio[src*="background.mp3"]') || document.querySelector('audio');
          if (bgAudio && window.userInteracted) {
            if (bgAudio.paused) {
              console.log('🎵 Playing background music...');
              bgAudio.play()
                .then(() => {
                  console.log('🎵 Background music started successfully!');
                  syncReactButton();
                })
                .catch(err => {
                  console.warn('⚠️ Audio play failed:', err);
                });
            } else {
              syncReactButton();
            }
          }
        };

        const syncReactButton = () => {
          const syncInterval = setInterval(() => {
            const playBtn = document.querySelector('button[title="Play"]');
            if (playBtn) {
              console.log('🎵 Syncing React play button state...');
              playBtn.click();
              clearInterval(syncInterval);
              events.forEach(evt => window.removeEventListener(evt, handleInteraction));
              if (window.audioCheckInterval) clearInterval(window.audioCheckInterval);
            }
            const pauseBtn = document.querySelector('button[title="Pause"]');
            if (pauseBtn) {
              console.log('🎵 React already synced to Pause state.');
              clearInterval(syncInterval);
              events.forEach(evt => window.removeEventListener(evt, handleInteraction));
              if (window.audioCheckInterval) clearInterval(window.audioCheckInterval);
            }
          }, 100);
          setTimeout(() => clearInterval(syncInterval), 15000);
        };

        events.forEach(evt => {
          window.addEventListener(evt, handleInteraction, { passive: true });
        });

        window.audioCheckInterval = setInterval(playBackgroundMusic, 200);
      })();

      // Cinematic Auto-Scroll & Video Autoplay Coordinator
      (function() {
        window.addEventListener('experience-started', () => {
          // Add scroll listener for auto-opening video when crossing 3700px (manual or auto-scroll)
          const checkScrollPosition = () => {
            if (window.aboutVideoOpened) return;
            const currentScroll = window.lenis ? window.lenis.scroll : window.scrollY;
            if (currentScroll >= 3700) {
              console.log('🎬 Scroll position crossed 3700. Auto-opening video...');
              window.aboutVideoOpened = true;
              window.dispatchEvent(new CustomEvent('open-about-video'));
              if (window.aboutVideoTimer) {
                clearTimeout(window.aboutVideoTimer);
                window.aboutVideoTimer = null;
              }
            }
          };

          if (window.lenis) {
            window.lenis.on('scroll', checkScrollPosition);
          } else {
            window.addEventListener('scroll', checkScrollPosition, { passive: true });
          }

          setTimeout(() => {
            if (window.lenis) {
              console.log('🎬 Experience started. Triggering auto-scroll to monolith...');
              window.lenis.scrollTo(3300, {
                duration: 5.5,
                easing: (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
                onComplete: () => {
                  console.log('🎬 Scroll complete. Waiting 9s for user to read Ruin stone...');
                  
                  let autoplayCancelled = false;

                  const cancelAutoplay = () => {
                    if (!autoplayCancelled) {
                      console.log('🎬 User scrolled/interacted. Cancelling autoplay...');
                      autoplayCancelled = true;
                      if (window.aboutVideoTimer) {
                        clearTimeout(window.aboutVideoTimer);
                        window.aboutVideoTimer = null;
                      }
                    }
                    cleanupListeners();
                  };
                  
                  const cleanupListeners = () => {
                    window.removeEventListener('wheel', cancelAutoplay);
                    window.removeEventListener('touchmove', cancelAutoplay);
                    window.removeEventListener('keydown', cancelAutoplay);
                    window.removeEventListener('mousedown', cancelAutoplay);
                  };
                  
                  window.addEventListener('wheel', cancelAutoplay, { passive: true });
                  window.addEventListener('touchmove', cancelAutoplay, { passive: true });
                  window.addEventListener('keydown', cancelAutoplay, { passive: true });
                  window.addEventListener('mousedown', cancelAutoplay, { passive: true });
                  
                  window.aboutVideoTimer = setTimeout(() => {
                    if (autoplayCancelled || window.aboutVideoOpened) {
                      cleanupListeners();
                      return;
                    }
                    
                    const currentScroll = window.lenis ? window.lenis.scroll : window.scrollY;
                    const isNearMonolith = Math.abs(currentScroll - 3300) < 200;
                    if (isNearMonolith) {
                      console.log('🎬 9s delay finished. Starting further auto-scroll past Ruin stone...');
                      
                      window.lenis.scrollTo(3800, {
                        duration: 3.0,
                        easing: (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
                        onComplete: () => {
                          cleanupListeners();
                          const finalScroll = window.lenis ? window.lenis.scroll : window.scrollY;
                          const isNearTarget = Math.abs(finalScroll - 3800) < 150;
                          if (!autoplayCancelled && !window.aboutVideoOpened && isNearTarget) {
                            console.log('🎬 Further scroll complete. Autoplay about video...');
                            window.aboutVideoOpened = true;
                            window.dispatchEvent(new CustomEvent('open-about-video'));
                          } else {
                            console.log('🎬 Further scroll complete, but autoplay was skipped or cancelled.');
                          }
                        }
                      });
                    } else {
                      console.log('🎬 Autoplay skipped: scrolled away from monolith.');
                      cleanupListeners();
                    }
                  }, 9000);
                }
              });
            }
          }, 100);
        });
      })();
    </script>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        // A/B Testing Assignment
        let experimentVariant = localStorage.getItem('Start_Button_Experiment');
        if (!experimentVariant) {
          experimentVariant = Math.random() < 0.5 ? 'Variant_A_Manual' : 'Variant_B_AutoClick';
          localStorage.setItem('Start_Button_Experiment', experimentVariant);
        }

        // Wait for Microsoft Clarity to be available, then set the Custom Tag
        const clarityInterval = setInterval(() => {
          if (typeof window.clarity === 'function') {
            window.clarity("set", "Start_Button_Experiment", experimentVariant);
            clearInterval(clarityInterval);
          }
        }, 500);
        
        // If Variant A, do nothing (user must click manually)
        if (experimentVariant === 'Variant_A_Manual') {
          return; 
        }

        let clicked = false;
        const clickInterval = setInterval(() => {
          const btn = document.getElementById('auto-start-btn');
          if (btn && !clicked) {
            clicked = true;
            clearInterval(clickInterval);
            
            // Create animated hand element
            const hand = document.createElement('div');
            hand.className = 'auto-click-hand';
            hand.innerHTML = '<img src="/images/hand_pointer.webp" alt="Pointer" style="width: 100%; height: 100%; object-fit: contain; transform: rotate(-15deg); filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));" />';
            btn.appendChild(hand);
            
            // Start animation after a short delay
            setTimeout(() => {
              hand.style.animation = 'autoClickHandAnim 1.2s forwards cubic-bezier(0.2, 0.8, 0.2, 1)';
              
              // Actually trigger the click when the animation "presses"
              setTimeout(() => {
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                  btn.click();
                }, 100);
              }, 1000);
            }, 800);
          }
        }, 300);
      });
    </script>
